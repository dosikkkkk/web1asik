<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table & Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html" class="active">Task 4</a>
    </nav>

    <div class="container">
        <h1 id="table-heading">Student Grade Report</h1>
        
        <table class="grades-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Dastan</td>
                    <td>SDP</td>
                    <td>C+</td>
                </tr>
                <tr class="highlight-row">
                    <td>Azamat</td>
                    <td>WEB 1</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Abubakir</td>
                    <td>OS</td>
                    <td>B+</td>
                </tr>
                <tr>
                    <td colspan="2">Class Average Grade</td>
                    <td>B</td>
                </tr>
            </tbody>
        </table>

        <h2 id="form-heading">Feedback Form</h2>
        
        <form class="feedback-form">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="role">Role:</label>
                <select id="role" name="role">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Would you recommend this course?</label>
                <div class="radio-group">
                    <input type="radio" id="yes" name="recommend" value="yes" checked>
                    <label for="yes">Yes</label>
                    <input type="radio" id="no" name="recommend" value="no">
                    <label for="no">No</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Your feedback..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

</body>
</html>
